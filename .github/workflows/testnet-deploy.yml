name: Deploy to Testnet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-contracts:
    name: Deploy Soroban Contracts to Testnet
    runs-on: ubuntu-latest
    outputs:
      registry_id: ${{ steps.deploy-registry.outputs.contract_id }}
      channel_id: ${{ steps.deploy-channel.outputs.contract_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deploy

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Stellar CLI
        run: cargo binstall -y stellar-cli

      - name: Setup Stellar identity
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          echo "$STELLAR_DEPLOYER_SECRET" | stellar keys add deployer --secret-key

      - name: Build contracts
        run: |
          (cd contracts/mesh-registry && stellar contract build)
          (cd contracts/mesh-channel && stellar contract build)

      - name: Deploy MeshRegistry
        id: deploy-registry
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm contracts/mesh-registry/target/wasm32v1-none/release/mesh_registry.wasm \
            --source deployer \
            --network testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015")
          echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "MeshRegistry deployed: $CONTRACT_ID"

      - name: Deploy MeshChannel
        id: deploy-channel
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm contracts/mesh-channel/target/wasm32v1-none/release/mesh_channel.wasm \
            --source deployer \
            --network testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015")
          echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "MeshChannel deployed: $CONTRACT_ID"

      - name: Initialize MeshRegistry
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          ADMIN_ADDRESS=$(stellar keys address deployer)
          stellar contract invoke \
            --id ${{ steps.deploy-registry.outputs.contract_id }} \
            --source deployer \
            --network testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015" \
            -- initialize \
            --admin "$ADMIN_ADDRESS"

      - name: Initialize MeshChannel
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          ADMIN_ADDRESS=$(stellar keys address deployer)
          stellar contract invoke \
            --id ${{ steps.deploy-channel.outputs.contract_id }} \
            --source deployer \
            --network testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015" \
            -- initialize \
            --admin "$ADMIN_ADDRESS" \
            --registry-id "${{ steps.deploy-registry.outputs.contract_id }}" \
            --xlm-asset CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC

      - name: Generate contract config
        run: |
          cat > deployed-contracts.json << EOF
          {
            "network": "testnet",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "meshRegistry": "${{ steps.deploy-registry.outputs.contract_id }}",
            "meshChannel": "${{ steps.deploy-channel.outputs.contract_id }}"
          }
          EOF
          cat deployed-contracts.json

      - name: Upload contract config artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployed-contracts
          path: deployed-contracts.json

